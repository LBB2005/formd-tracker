# Daily rebuild: SEC data -> enrichment (chunked) -> BigQuery -> website.
#
# One-time setup (repository Settings):
#   Secrets:    SEC_USER_AGENT     "Your Name your@email"  (SEC fair-access policy)
#               ANTHROPIC_API_KEY  Claude API key for the AI tie-break judge (optional)
#   Variables:  BQ_PROJECT, GCP_WIF_PROVIDER, GCP_SA_EMAIL  (BigQuery via keyless
#               Workload Identity Federation; no Google key is stored anywhere)
#               CLAUDE_MAX_USD  per-run cap on Claude batch spend (optional, default 10)
#   Pages:      Build and deployment > Source: GitHub Actions
#
# Each run checks new company homepages for up to AI_MINUTES, then saves progress by
# committing data/enrich/ (small Parquet files) back to the repo, so the nationwide AI pass
# finishes over a few daily runs and later runs only touch new filings. Claude batches
# submitted in one run are collected by the next.

name: refresh

on:
  schedule:
    - cron: "0 9 * * *"    # daily 09:00 UTC
  workflow_dispatch:
    inputs:
      ai_minutes:
        description: "Minutes to spend checking new company homepages"
        default: "180"

permissions:
  contents: write    # commit data/enrich progress
  pages: write
  id-token: write    # Workload Identity Federation (Google) + Pages

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_MINUTES: ${{ inputs.ai_minutes || '180' }}
      # Estimated dollars of Claude batch requests submitted per run (batch prices); the
      # rest wait for later runs. Set the CLAUDE_MAX_USD repository variable to change it.
      CLAUDE_MAX_USD: ${{ vars.CLAUDE_MAX_USD || '10' }}
    steps:
      # The latest main, not the SHA from when the run was queued: a run that waited behind
      # another must start from the enrichment that run pushed. This job only ever saves to
      # and deploys from main, so it builds main whichever branch it was dispatched from.
      - id: checkout
        uses: actions/checkout@v7
        with:
          ref: main

      # setup-uv no longer publishes major tags (v8+), so pin the immutable release.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Only the expensive-to-refetch SEC/Census/ADV downloads are cached; homepage HTML
      # isn't needed again because ai_checks.parquet records every company checked.
      - name: Restore download cache
        uses: actions/cache@v6
        with:
          path: |
            data/cache/quarterly
            data/cache/daily
            data/cache/census
            data/cache/geocode
            data/cache/adv
            data/cache/yc
          key: formd-cache-${{ github.run_id }}
          restore-keys: formd-cache-

      - name: Install
        run: |
          uv sync
          npm ci --prefix site

      - name: Build database (SEC quarterly sets + EDGAR filings since)
        run: uv run python -m pipeline.build

      # Enrichment steps may fail on a bad day (an outside service down); the run keeps
      # going with yesterday's results, and progress is always saved.
      - name: Form ADV advisers
        continue-on-error: true
        run: uv run python -m pipeline.adv

      - name: Geocode new addresses
        continue-on-error: true
        run: uv run python -m pipeline.geocode

      - name: AI evidence for new companies
        continue-on-error: true
        run: uv run python -u -m pipeline.ai_tag --max-minutes "$AI_MINUTES"

      - name: Rebuild tables with enrichment
        run: uv run python -m pipeline.build --sql-only

      - name: Tests
        run: uv run pytest -q

      # Each run reads data/enrich from main and writes a superset of it, so if someone else
      # changed those files meanwhile, neither version can win without dropping the other's
      # rows. On that conflict this run's progress is skipped with a warning (the next run
      # redoes it) rather than failing the job. A push race with no conflict just retries.
      - name: Save enrichment progress
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          git config user.name "formd-bot"
          git config user.email "formd-bot@users.noreply.github.com"
          git add data/enrich
          git diff --cached --quiet && exit 0
          git commit -m "Refresh enrichment (run ${{ github.run_id }})"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              git push origin HEAD:main && exit 0
            elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
              echo "::warning::data/enrich changed on main during this run; this run's enrichment is not saved and the next run redoes it."
              # Batches submitted this run are paid for but now untracked: list them.
              lost=$(git diff origin/main HEAD -- data/enrich/claude_batches.json \
                | grep -o '^+ *"id": "msgbatch_[A-Za-z0-9]*' | grep -o 'msgbatch_[A-Za-z0-9]*' || true)
              [ -z "$lost" ] || echo "::warning::Claude batches from this run won't be collected: $lost"
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::warning::Could not push enrichment progress after 3 attempts; the next run redoes it."

      - name: Export and build site
        run: |
          uv run python -m pipeline.export
          npm run build --prefix site

      - name: Authenticate to Google Cloud
        if: ${{ vars.GCP_WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up gcloud
        if: ${{ vars.GCP_WIF_PROVIDER != '' }}
        uses: google-github-actions/setup-gcloud@v3

      # A Google auth timeout shouldn't block the site; the next run replaces every table.
      - name: Load BigQuery
        if: ${{ vars.GCP_WIF_PROVIDER != '' }}
        continue-on-error: true
        env:
          BQ_PROJECT: ${{ vars.BQ_PROJECT }}
          BQ_DATASET: ${{ vars.BQ_DATASET || 'formd' }}
        run: uv run python -m pipeline.bigquery

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# Metro definitions. Each issuer's principal-office ZIP is mapped to a county
# (Census 2020 ZCTA-to-county file); the county decides the metro.
# To add a metro: add a block with a label, its county FIPS codes, a bounding box
# [lat_min, lat_max, lon_min, lon_max] and a map view [lat, lon, zoom], then rebuild.
# The box catches mistyped ZIPs: an issuer whose street address geocodes outside it is
# dropped from the metro. Issuers outside every metro still count toward "All US".
start_year: 2019

metros:
  sf_bay:
    label: SF Bay Area
    bbox: [36.9, 38.5, -123.2, -121.2]
    view: [37.62, -122.25, 10]
    counties:
      "06075": San Francisco
      "06081": San Mateo
      "06085": Santa Clara
      "06001": Alameda
  nyc:

[project]
name = "formd-tracker"
version = "0.1.0"
description = "SF and LA private capital tracker built on SEC Form D filings"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.32",
    "pyyaml>=6.0",
    "anthropic>=1.11.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
